function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuf(a,r){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function build(seed){const r=rng(seed),ids=shuf(ALL.map((_,i)=>i),r).slice(0,N);
 return ids.map(i=>{const o=ALL[i],q=o.q;
  if(!o.t)return{t:0,id:i,s:q[0],o:shuf(q[1].map((x,k)=>({x,ok:k===q[2]})),r)};
  return{t:1,id:i,s:q[0],it:q[1],o:shuf(q[2].map((x,k)=>({x,k})),r),a:q[3]}})}
function examFor(n){const seen=new Set();let e;
 for(let k=1;k<=n;k++){let salt=0;do{e=build(k*7919+salt*104729+20241);salt++}
  while(seen.has(sig(e)));seen.add(sig(e))}
 return e}
function sig(e){return e.map(q=>q.id+":"+q.o.map(o=>o.x.length+(o.k??(o.ok?"t":"f"))).join(",")).join("|")}

 const next=()=>{ft.innerHTML=`<button class="b" id="nx">${i+1<N?"Câu tiếp theo":"Hoàn thành"}</button>`;document.getElementById("nx").onclick=()=>{i++;show()}};
 const end=ok=>{if(done)return;done=true;res[i]=ok?1:0;cd.classList.add(ok?"ok":"no");next()};

 else{const L="abcd";bd.innerHTML=q.o.map((o,k)=>`<div style="margin-top:8px"><b>${L[k]}.</b> ${esc(o.x)}</div>`).join("")+q.it.map((t,k)=>`<div class="r"><span>${k+1}. ${esc(t)}</span><select data-k="${k}"><option value="">–</option>${q.o.map((o,j)=>`<option value="${j}">${L[j]}</option>`).join("")}</select></div>`).join("");
